name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Select Xcode 26
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH"
          SDK_VERSION=$(xcrun --show-sdk-version --sdk macosx)
          echo "Selected $XCODE_PATH with macOS SDK $SDK_VERSION"
          [ "${SDK_VERSION%%.*}" -ge 26 ] || { echo "macOS SDK >= 26 required"; exit 1; }

      - name: Build (arm64)
        run: swift build --arch arm64

      - name: Unit and smoke tests
        run: swift test --parallel

      - name: Lint
        run: ./scripts/lint.sh

  website:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Typecheck
        run: npm run typecheck

      - name: Build website
        run: npm run build
